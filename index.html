<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-base: #0a1f24; --bg-surface: #0f2a30; --bg-elev: #143840;
    --bg-card: rgba(29, 158, 117, 0.06); --bg-card-hover: rgba(29, 158, 117, 0.12);
    --border-soft: rgba(29, 158, 117, 0.18); --border-mid: rgba(29, 158, 117, 0.35); --border-strong: rgba(29, 158, 117, 0.6);
    --text-primary: #e8f5f0; --text-secondary: #8ab8b0; --text-muted: #5a8a82;
    --neon: #5dcaa5; --neon-bright: #7fe5c0; --neon-dim: rgba(93, 202, 165, 0.15);
    --accent-amber: #ef9f27; --danger: #f09595; --danger-bg: rgba(240, 149, 149, 0.1); --warning: #efbf27;
  }
  html, body {
    background: var(--bg-base); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic UI', Meiryo, sans-serif;
    font-size: 15px; line-height: 1.6; min-height: 100vh;
  }
  body {
    background: radial-gradient(ellipse 800px 400px at top, rgba(29, 158, 117, 0.05), transparent), var(--bg-base);
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 16px 16px;
  }
  .app-container { max-width: 1100px; margin: 0 auto; }
  .main-spacer { height: 0; }

  .header { background: var(--bg-surface); border: 0.5px solid var(--border-soft); border-radius: 14px; padding: 14px 18px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 50; box-shadow: 0 4px 20px rgba(0,0,0,0.4); will-change: transform; }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon { width: 42px; height: 42px; border-radius: 11px; background: #0f2a30; border: 0.5px solid var(--border-mid); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 18px rgba(93, 202, 165, 0.25); overflow: hidden; }
  .brand-icon svg { display: block; }
  .brand-text-main { font-size: 15px; font-weight: 600; color: var(--text-primary); }
  .brand-text-sub { font-size: 10px; color: var(--neon); letter-spacing: 1.5px; margin-top: 2px; display: flex; align-items: center; gap: 5px; }
  .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 8px var(--neon); animation: pulse 2s infinite; }
  .pulse-dot.offline { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .pulse-dot.syncing { background: var(--accent-amber); box-shadow: 0 0 8px var(--accent-amber); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .nav-tabs { display: flex; gap: 3px; flex-wrap: wrap; }
  .nav-tab { padding: 9px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; color: #87D9F5; background: transparent; border: none; display: inline-flex; align-items: center; gap: 5px; font-family: inherit; transition: all 0.15s; }
  .nav-tab:hover { color: var(--text-primary); background: var(--bg-card); }
  .nav-tab.active { background: rgba(135,217,245,0.15); color: #87D9F5; border: 0.5px solid rgba(135,217,245,0.35); font-weight: 500; }

  .btn { padding: 10px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; transition: all 0.15s; white-space: nowrap; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--neon); color: #0a1f24; font-weight: 600; box-shadow: 0 0 12px rgba(93, 202, 165, 0.25); }
  .btn-primary:hover:not(:disabled) { background: var(--neon-bright); }
  .btn-ghost { background: transparent; color: var(--text-secondary); border: 0.5px solid var(--border-mid); }
  .btn-ghost:hover:not(:disabled) { color: var(--text-primary); background: var(--bg-card); border-color: var(--neon); }
  .btn-danger { background: transparent; color: var(--danger); border: 0.5px solid rgba(240, 149, 149, 0.3); }
  .btn-danger:hover:not(:disabled) { background: var(--danger-bg); }

  .card { background: var(--bg-surface); border: 0.5px solid var(--border-soft); border-radius: 12px; padding: 16px 18px; }
  .card-inner { background: var(--bg-card); border-radius: 8px; padding: 10px 12px; }

  input[type="text"], input[type="tel"], input[type="email"], input[type="date"], textarea, select {
    width: 100%; padding: 11px 14px; background: var(--bg-base); border: 0.5px solid var(--border-soft); border-radius: 8px; color: var(--text-primary); font-size: 16px; font-family: inherit; transition: border-color 0.15s, background 0.15s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--neon); background: var(--bg-elev); }
  select option { background: var(--bg-base); color: var(--text-primary); }
  input[type="checkbox"] { width: auto; accent-color: var(--neon); cursor: pointer; }
  textarea { resize: vertical; min-height: 60px; }

  .field-row { margin-bottom: 12px; }
  .field-label { font-size: 11px; color: #87D9F5; margin-bottom: 5px; letter-spacing: 0.4px; display: flex; align-items: center; gap: 5px; }
  .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .section-title { font-size: 10px; color: #87D9F5; text-transform: uppercase; letter-spacing: 1.5px; margin: 20px 0 8px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .section-title::before { content: ""; width: 3px; height: 12px; background: #87D9F5; border-radius: 2px; }

  .chip { display: inline-flex; align-items: center; gap: 3px; padding: 5px 12px; border-radius: 999px; font-size: 12px; margin: 2px; border: 0.5px solid transparent; background: var(--bg-card); color: var(--text-secondary); }
  .chip-lg { padding: 4px 10px; font-size: 11px; margin: 2px; }
  .chip.q { background: rgba(135, 217, 245, 0.12); color: #87D9F5; border-color: rgba(135, 217, 245, 0.3); }
  .chip.w { background: rgba(135, 217, 245, 0.12); color: #87D9F5; border-color: rgba(135, 217, 245, 0.3); }
  .chip.l { background: var(--neon-dim); color: var(--neon); border-color: var(--border-mid); }
  .chip.muted { background: rgba(138, 184, 176, 0.1); color: var(--text-muted); }
  .chip-btn { cursor: pointer; transition: all 0.15s; }
  .chip-btn:hover { border-color: var(--neon); }
  .chip-btn.selected { background: var(--neon); color: #0a1f24; border-color: var(--neon); font-weight: 500; }

  .table-wrap { background: var(--bg-surface); border: 0.5px solid var(--border-soft); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 10px; color: var(--neon); font-weight: 500; padding: 12px; border-bottom: 0.5px solid var(--border-mid); letter-spacing: 0.8px; text-transform: uppercase; background: var(--bg-card); white-space: nowrap; }
  td { padding: 12px; font-size: 13px; color: var(--text-primary); border-bottom: 0.5px solid var(--border-soft); }
  tr:last-child td { border-bottom: none; }
  tr.tr-click { cursor: pointer; transition: background 0.15s; }
  tr.tr-click:hover td { background: var(--bg-card-hover); }

  .row-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--bg-surface); border: 0.5px solid var(--border-soft); border-radius: 10px; margin-bottom: 6px; cursor: pointer; transition: all 0.15s; }
  .row-card:hover { border-color: var(--border-mid); background: var(--bg-elev); }
  .avatar { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--neon), #1d9e75); display: flex; align-items: center; justify-content: center; font-weight: 600; color: #0a1f24; font-size: 14px; flex-shrink: 0; }
  .avatar.alt { background: linear-gradient(135deg, #7fe5c0, #1d9e75); }
  .avatar.alt2 { background: linear-gradient(135deg, #5dcaa5, #0f6e56); }

  .star-filled { color: var(--accent-amber); } .star-empty { color: rgba(138, 184, 176, 0.3); }
  .stat-bar { height: 6px; background: var(--bg-base); border-radius: 999px; overflow: hidden; }
  .stat-bar-fill { height: 100%; background: linear-gradient(90deg, var(--neon), var(--neon-bright)); border-radius: 999px; transition: width 0.3s; }
  .review-card { background: var(--bg-card); border: 0.5px solid var(--border-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
  .modal-box { background: var(--bg-surface); border: 0.5px solid var(--border-mid); border-radius: 14px; padding: 22px; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto; box-shadow: 0 0 40px rgba(0, 0, 0, 0.6); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--neon); color: #0a1f24; padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 2000; box-shadow: 0 4px 20px rgba(93, 202, 165, 0.4); animation: slideUp 0.2s ease; }
  .toast.error { background: var(--danger); }
  .toast.warn { background: var(--accent-amber); }
  @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } }

  .icon-btn { background: transparent; border: 0.5px solid var(--border-soft); width: 30px; height: 30px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: all 0.15s; }
  .icon-btn:hover:not(:disabled) { background: var(--bg-card); color: var(--neon); border-color: var(--neon); }
  .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); font-size: 13px; background: var(--bg-card); border-radius: 10px; }
  .empty-state i { font-size: 32px; color: var(--text-muted); display: block; margin-bottom: 10px; }

  .loading-overlay { position: fixed; inset: 0; background: rgba(10, 31, 36, 0.9); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 3000; flex-direction: column; gap: 16px; }
  .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--border-soft); border-top-color: var(--neon); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 4px; }

  .list-row:hover { background: var(--bg-card-hover); }
  @media (max-width: 600px) { body { padding: 6px 10px 10px 10px; } .card { padding: 14px; } th, td { padding: 8px 6px; font-size: 12px; } }
</style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="header-brand">
      <div class="brand-icon">
        <svg width="34" height="34" viewBox="0 0 120 120">
          <path d="M 22 60 Q 22 22 60 22 Q 98 22 98 60 L 98 68 L 22 68 Z" fill="#5dcaa5"/>
          <rect x="20" y="66" width="80" height="8" rx="2" fill="#1d9e75"/>
          <path d="M 50 24 L 70 24 L 70 40 L 50 40 Z" fill="#0f2a30" fill-opacity="0.7"/>
          <line x1="60" y1="22" x2="60" y2="68" stroke="#1d9e75" stroke-width="2" stroke-opacity="0.4"/>
          <path d="M 34 76 Q 34 74 36 74 L 50 74 Q 52 74 52 76 L 52 82 L 34 82 Z" fill="#e8f5f0"/>
          <path d="M 68 76 Q 68 74 70 74 L 84 74 Q 86 74 86 76 L 86 82 L 68 82 Z" fill="#e8f5f0"/>
          <circle cx="43" cy="78" r="2" fill="#0f2a30"/>
          <circle cx="77" cy="78" r="2" fill="#0f2a30"/>
          <path d="M 50 94 Q 60 100 70 94" fill="none" stroke="#5dcaa5" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-text-main">協力業者管理システム</div>
        <div class="brand-text-sub"><span class="pulse-dot" id="status-dot"></span><span id="header-stats">CONNECTING...</span></div>
      </div>
    </div>
    <div class="nav-tabs" id="nav-tabs"></div>
  </div>

  <div id="header-spacer" style="height: 0;"></div>
  <div id="main-view"></div>
</div>

<div id="modal-root"></div>
<div id="loading-overlay" class="loading-overlay" style="display:none;">
  <div class="loading-spinner"></div>
  <div style="color: var(--text-secondary); font-size: 13px;" id="loading-text">読み込み中...</div>
</div>

<script>
(function() {

const api = {
  load: () => callGAS('load'),
  saveContractor: (contractor, clientVersion) => callGAS('saveContractor', { contractor, clientVersion }),
  deleteContractor: (id) => callGAS('deleteContractor', { id }),
  saveReview: (review) => callGAS('saveReview', { review }),
  deleteReview: (id) => callGAS('deleteReview', { id }),
  saveMasters: (masters) => callGAS('saveMasters', { masters }),
  replaceAll: (data) => callGAS('replaceAll', { data })
};

// ============== API設定 ==============
// ⚠️ ここにGASのウェブアプリURLを設定してください
const API_URL = 'https://script.google.com/macros/s/AKfycbwm10F9y6JZojJWMoPtrJkdkmZk_YI2zv2xX7w-fJ4CltzMOsbHyDxEmE7XZGCbRL7X7A/exec';

// JSONPでGETリクエスト (CORS回避)
function jsonpGet(action) {
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonp_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    const script = document.createElement('script');
    let done = false;
    const timeout = setTimeout(() => {
      if (!done) {
        done = true;
        cleanup();
        reject(new Error('リクエストがタイムアウトしました'));
      }
    }, 30000);
    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[callbackName] = function(data) {
      if (done) return;
      done = true;
      cleanup();
      if (data && data.ok === false) reject(new Error(data.error || 'Unknown error'));
      else resolve(data && data.data);
    };
    script.onerror = () => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('ネットワークエラー'));
    };
    const sep = API_URL.indexOf('?') >= 0 ? '&' : '?';
    script.src = API_URL + sep + 'action=' + encodeURIComponent(action) + '&callback=' + callbackName;
    document.body.appendChild(script);
  });
}

// POSTリクエスト (text/plainでpreflight回避)
async function apiPost(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    redirect: 'follow',
    body: JSON.stringify(body),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (json && json.ok === false) throw new Error(json.error || 'Unknown error');
  return json && json.data;
}

function callGAS(action, params) {
  setStatus('syncing');
  const p = params || {};
  let promise;
  if (action === 'load') {
    promise = jsonpGet('load');
  } else {
    promise = apiPost(Object.assign({ action: action }, p));
  }
  return promise
    .then(result => { setStatus('online'); return result; })
    .catch(err => { setStatus('offline'); throw err; });
}

function setStatus(s) {
  const dot = document.getElementById('status-dot');
  if (!dot) return;
  dot.className = 'pulse-dot' + (s === 'offline' ? ' offline' : s === 'syncing' ? ' syncing' : '');
}

let state = { contractors: [], reviews: [], masters: { qualifications: [], workTypes: [], evaluationCategories: [], siteManagers: [] } };
let currentView = 'list';
let currentContractorId = null;
let editingContractorId = null;
let formData = null;
let backTarget = 'list'; // 詳細から戻る先 ('list' or 'search')
let searchFilters = { freeText: '', hasLicense: false, quals: [], works: [] };

function uid(p) { return p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name) { const p = (name || '?').trim().split(/\s+/); return p.length >= 2 ? (p[0][0] || '') + (p[1][0] || '') : (name || '?').slice(0, 1); }

function avgScoreByCategory(contractorId) {
  const rs = state.reviews.filter(r => r.contractorId === contractorId);
  if (!rs.length) return null;
  const out = {};
  state.masters.evaluationCategories.forEach(cat => {
    let sum = 0, n = 0;
    rs.forEach(r => { if (r.scores[cat] != null) { sum += r.scores[cat]; n++; } });
    if (n) out[cat] = sum / n;
  });
  return out;
}
function avgScore(contractorId) {
  const c = avgScoreByCategory(contractorId);
  if (!c) return null;
  const v = Object.values(c);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function reviewCount(id) { return state.reviews.filter(r => r.contractorId === id).length; }
function stars(n) {
  const f = Math.round(Number(n));
  let h = '';
  for (let i = 1; i <= 5; i++) h += `<i class="ti ti-star ${i <= f ? 'star-filled' : 'star-empty'}" style="font-size:13px;"></i>`;
  return h;
}

function toast(msg, type) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function showModal(html) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-bg" id="modal-bg"><div class="modal-box" onclick="event.stopPropagation()">${html}</div></div>`;
  document.getElementById('modal-bg').addEventListener('click', closeModal);
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }
window.closeModal = closeModal;

function showLoading(text) {
  document.getElementById('loading-text').textContent = text || '読み込み中...';
  document.getElementById('loading-overlay').style.display = 'flex';
}
function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }

async function refreshData() {
  try {
    const data = await api.load();
    state.contractors = data.contractors || [];
    state.reviews = data.reviews || [];
    state.masters = data.masters || state.masters;
    return true;
  } catch (e) {
    toast('データの取得に失敗しました: ' + e.message, 'error');
    return false;
  }
}

function renderNav() {
  document.getElementById('header-stats').textContent = `${state.contractors.length} COMPANIES / ${state.reviews.length} REVIEWS`;
  const tabs = [
    { id: 'list', label: '一覧', icon: 'ti-list' },
    { id: 'search', label: '検索', icon: 'ti-search' },
    { id: 'register', label: '新規登録', icon: 'ti-plus' },
    { id: 'master', label: 'マスタ', icon: 'ti-database' },
    { id: 'csv', label: 'CSV', icon: 'ti-file-export' }
  ];
  document.getElementById('nav-tabs').innerHTML = tabs.map(t =>
    `<button class="nav-tab ${currentView === t.id ? 'active' : ''}" data-v="${t.id}"><i class="ti ${t.icon}"></i>${t.label}</button>`
  ).join('');
  document.querySelectorAll('.nav-tab').forEach(b => b.addEventListener('click', () => {
    currentView = b.dataset.v;
    editingContractorId = null;
    render();
  }));
}

function renderList() {
  const v = document.getElementById('main-view');
  v.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;">
      <div style="font-size:17px;font-weight:600;">業者一覧 <span style="font-size:13px;color:var(--text-secondary);font-weight:400;margin-left:8px;">${state.contractors.length}社</span></div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-ghost" id="btn-refresh"><i class="ti ti-refresh"></i>更新</button>
        <button class="btn btn-primary" id="btn-add-new"><i class="ti ti-plus"></i>新規登録</button>
      </div>
    </div>
    ${state.contractors.length === 0 ? `
      <div class="empty-state"><i class="ti ti-building"></i>まだ業者が登録されていません<br>
        <button class="btn btn-primary" id="btn-add-empty" style="margin-top:14px;"><i class="ti ti-plus"></i>最初の業者を登録する</button>
      </div>
    ` : `
      <div style="background:var(--bg-surface);border:0.5px solid var(--border-soft);border-radius:12px;overflow:hidden;">

  document.getElementById('btn-add-empty')?.addEventListener('click', goNew);

      </div>
      <div class="field-row" style="margin-bottom:18px;">
        <div class="field-label" style="font-size:13px;"><i class="ti ti-search"></i>フリーワード検索 <span style="color:var(--text-muted);font-weight:400;">(会社名・担当者・住所を同時検索)</span></div>
        <input type="text" id="f-freetext" value="${esc(searchFilters.freeText)}" placeholder="例: 山田 / 佐藤 / 渋谷" />

        <label style="display:inline-flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;">

      <div class="field-row" style="margin-bottom:18px;">

        <div id="f-quals">${state.masters.qualifications.map(q =>
          `<span class="chip chip-lg chip-btn ${searchFilters.quals.includes(q) ? 'selected' : 'q'}" data-q="${esc(q)}">${esc(q)}</span>`).join('')}</div>
      </div>
      <div class="field-row" style="margin-bottom:14px;">
        <div class="field-label" style="font-size:13px;"><i class="ti ti-tools"></i>施工可能工事種目 <span style="color:var(--text-muted);font-weight:400;">(複数選択でAND)</span></div>
        <div id="f-works">${state.masters.workTypes.map(w =>
          `<span class="chip chip-lg chip-btn ${searchFilters.works.includes(w) ? 'selected' : 'w'}" data-w="${esc(w)}">${esc(w)}</span>`).join('')}</div>
      </div>
      <div style="display:flex;gap:6px;margin-top:14px;"><button class="btn btn-ghost" id="btn-clear-search"><i class="ti ti-refresh"></i>条件をクリア</button></div>
    </div>
    <div id="search-results" style="margin-top:14px;"></div>
  `;
  document.getElementById('f-freetext').addEventListener('input', e => { searchFilters.freeText = e.target.value; doSearch(); });
  document.getElementById('f-license').addEventListener('change', e => { searchFilters.hasLicense = e.target.checked; doSearch(); });
  document.querySelectorAll('#f-quals .chip-btn').forEach(c => c.addEventListener('click', () => {
    const q = c.dataset.q;
    if (searchFilters.quals.includes(q)) searchFilters.quals = searchFilters.quals.filter(x => x !== q);
    else searchFilters.quals.push(q);
    renderSearch();
  }));
  document.querySelectorAll('#f-works .chip-btn').forEach(c => c.addEventListener('click', () => {
    const w = c.dataset.w;
    if (searchFilters.works.includes(w)) searchFilters.works = searchFilters.works.filter(x => x !== w);
    else searchFilters.works.push(w);
    renderSearch();
  }));
  document.getElementById('btn-clear-search').addEventListener('click', () => {
    searchFilters = { freeText: '', hasLicense: false, quals: [], works: [] };
    renderSearch();
  });
  doSearch();
}

function doSearch() {
  const f = searchFilters;
  const ft = (f.freeText || '').toLowerCase().trim();
  const results = state.contractors.filter(c => {
    if (ft) {
      const inName = c.name.toLowerCase().includes(ft);
      const inContact = c.contacts.some(ct => (ct.name || '').toLowerCase().includes(ft));
      const inAddress = (c.address || '').toLowerCase().includes(ft);
      if (!inName && !inContact && !inAddress) return false;
    }
    if (f.hasLicense && !c.hasLicense) return false;
    if (f.quals.length && !f.quals.every(q => c.qualifications.includes(q))) return false;
    if (f.works.length && !f.works.every(w => c.workTypes.includes(w))) return false;
    return true;
  });
  const r = document.getElementById('search-results');
  if (!r) return;
  const ac = [f.freeText, f.hasLicense, ...f.quals, ...f.works].filter(Boolean).length;
  if (!results.length) {
    r.innerHTML = `<div class="empty-state"><i class="ti ti-mood-empty"></i>該当する業者が見つかりませんでした</div>`;
    return;
  }
  r.innerHTML = `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;display:flex;justify-content:space-between;padding:0 4px;">
    <span><i class="ti ti-filter"></i> ${results.length}件 / ${state.contractors.length}件</span><span>${ac}個の条件適用中</span></div>
    ${results.map((c, i) => contractorRowCard(c, i)).join('')}`;
  bindRowClicks();
}

function initForm() {
  if (editingContractorId) {
    const c = state.contractors.find(x => x.id === editingContractorId);
    formData = JSON.parse(JSON.stringify(c));
    formData._clientVersion = c.updatedAt || 0;
    formData.contacts.forEach(ct => { if (!('email' in ct)) ct.email = ''; });
  } else {
    formData = { name: '', address: '', hasLicense: false, contacts: [{ name: '', phone: '', email: '', role: '' }], qualifications: [], workTypes: [], note: '', _clientVersion: 0 };
  }
}

function checkDuplicate() {
  const name = (formData.name || '').trim();
  const w = document.getElementById('dup-warning');
  if (!name) { w.style.display = 'none'; return; }
  const dups = state.contractors.filter(c => c.id !== editingContractorId && c.name.trim() === name);
  if (dups.length) {
    w.style.display = 'block';
    w.innerHTML = `<i class="ti ti-alert-triangle"></i> 同名の業者が既に${dups.length}件登録されています。登録時に確認します。`;
  } else { w.style.display = 'none'; }
}

async function saveContractor() {
  if (!formData.name.trim()) { toast('会社名を入力してください', 'warn'); return; }
  formData.contacts = formData.contacts.filter(c => c.name.trim() || c.phone.trim() || c.email.trim());
  if (!formData.contacts.length) formData.contacts = [{ name: '', phone: '', email: '', role: '' }];

  const dups = state.contractors.filter(c => c.id !== editingContractorId && c.name.trim() === formData.name.trim());
  if (dups.length) {
    showModal(`
      <div style="font-size:15px;font-weight:500;margin-bottom:8px;"><i class="ti ti-alert-triangle" style="color:var(--accent-amber);"></i> 同名の業者があります</div>
      <div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">「${esc(formData.name)}」は既に${dups.length}件登録されています。それでも登録しますか？</div>
      <div style="margin-bottom:14px;">${dups.map(d => `<div style="font-size:11px;background:var(--bg-card);padding:7px 12px;border-radius:7px;margin-bottom:4px;">${esc(d.name)} / ${esc(d.address || '住所未登録')}</div>`).join('')}</div>
      <div style="display:flex;gap:6px;justify-content:flex-end;">
        <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
        <button class="btn btn-primary" id="confirm-dup">それでも登録する</button>
      </div>`);
    document.getElementById('confirm-dup').addEventListener('click', () => { closeModal(); finalizeSave(); });
  } else { finalizeSave(); }
}

async function finalizeSave() {
  showLoading('保存中...');
  try {
    const payload = {
      id: editingContractorId || '',
      name: formData.name, address: formData.address, hasLicense: formData.hasLicense,
      contacts: formData.contacts, qualifications: formData.qualifications,
      workTypes: formData.workTypes, note: formData.note
    };
    const result = await api.saveContractor(payload, formData._clientVersion || 0);
    if (result && result.conflict) {
      hideLoading();
      showModal(`
        <div style="font-size:15px;font-weight:500;margin-bottom:8px;"><i class="ti ti-alert-triangle" style="color:var(--accent-amber);"></i> 同時編集を検知しました</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:14px;">他のユーザーがこの業者を更新しました。最新版を読み込んでから再編集してください。</div>
        <div style="display:flex;gap:6px;justify-content:flex-end;">
          <button class="btn btn-primary" id="reload-now"><i class="ti ti-refresh"></i>最新を読み込む</button>
        </div>`);
      document.getElementById('reload-now').addEventListener('click', async () => {
        closeModal();
        showLoading('再読込中...');
        await refreshData();
        hideLoading();
        if (editingContractorId) {
          formData = null;
          currentView = 'detail';
          currentContractorId = editingContractorId;
          editingContractorId = null;
          render();
        } else {
          currentView = 'list';
          render();
        }
      });
      return;
    }
    await refreshData();
    hideLoading();
    if (editingContractorId) {
      currentContractorId = editingContractorId;
      editingContractorId = null;
      currentView = 'detail';
      toast('業者情報を更新しました');
    } else {
      currentView = 'list';
      toast('業者を登録しました');
    }
    formData = null;
    render();
  } catch (e) {
    hideLoading();
    toast('保存に失敗しました: ' + e.message, 'error');
  }
}

function csvEsc(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

function buildCSV(type) {
  let csv = '';
  if (type === 'contractors') {
    // 最大窓口数を確認 (最低3、それ以上ある場合は実数)
    let maxContacts = 3;
    state.contractors.forEach(c => { if (c.contacts.length > maxContacts) maxContacts = c.contacts.length; });
    const header = ['会社名', '住所', '建設業許可'];
    for (let i = 1; i <= maxContacts; i++) {
      header.push(`窓口${i}_氏名`, `窓口${i}_役職`, `窓口${i}_電話`, `窓口${i}_メール`);
    }
    header.push('資格', '工事種目', '備考');
    csv = header.join(',') + '\n';
    state.contractors.forEach(c => {
      const row = [c.name, c.address, c.hasLicense ? '有' : '無'];
      for (let i = 0; i < maxContacts; i++) {
        const ct = c.contacts[i] || { name: '', role: '', phone: '', email: '' };
        row.push(ct.name || '', ct.role || '', ct.phone || '', ct.email || '');
      }
      row.push(c.qualifications.join(';'), c.workTypes.join(';'), c.note || '');
      csv += row.map(csvEsc).join(',') + '\n';
    });
  } else if (type === 'reviews') {
    csv = '会社名,現場名,評価者,日付,' + state.masters.evaluationCategories.join(',') + ',コメント\n';
    state.reviews.forEach(r => {
      const c = state.contractors.find(x => x.id === r.contractorId);
      const row = [c ? c.name : '', r.siteName, r.reviewer, r.date];
      state.masters.evaluationCategories.forEach(cat => row.push(r.scores[cat] || ''));
      row.push(r.comment || '');
      csv += row.map(csvEsc).join(',') + '\n';
    });
  } else if (type === 'masters') {
    csv = '種別,項目\n';
    [['資格', 'qualifications'], ['工事種目', 'workTypes'], ['評価項目', 'evaluationCategories'], ['現場担当', 'siteManagers']].forEach(([l, k]) => {
      state.masters[k].forEach(item => { csv += `${csvEsc(l)},${csvEsc(item)}\n`; });
    });
  }
  return csv;
}

function doExport(type) {
  const csv = buildCSV(type);

}

function parseCSV(text) {
  const rows = []; let row = [], cur = '', inq = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inq) {
      if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inq = false; else cur += ch;
    } else {
      if (ch === '"') inq = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (ch !== '\r') cur += ch;
    }
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

async function doImport() {
  const type = document.getElementById('imp-type').value;
  const text = document.getElementById('imp-text').value.trim();
  if (!text) { toast('CSVを入力してください', 'warn'); return; }
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('データがありません', 'warn'); return; }
  rows.shift();
  const items = [];
  if (type === 'contractors') {
    // ヘッダー行から窓口列の構成を判定
    const headerRow = parseCSV(text)[0] || [];
    const isNewFormat = headerRow.some(h => /窓口\d+_氏名/.test(h));
    rows.forEach(r => {
      if (!r[0]) return;
      let contacts = [];
      if (isNewFormat) {
        // 新形式: 窓口1_氏名,窓口1_役職,窓口1_電話,窓口1_メール,窓口2_...
        // 窓口列の開始位置(列3)から、4列ごとに1窓口
        let contactStart = 3;
        // ヘッダーから「資格」の位置を探す = 窓口列の終わり
        const headerCols = headerRow;
        let qualIdx = headerCols.findIndex(h => h === '資格');
        if (qualIdx < 0) qualIdx = headerCols.length - 3;
        const numContacts = Math.floor((qualIdx - contactStart) / 4);
        for (let i = 0; i < numContacts; i++) {
          const base = contactStart + i * 4;
          const name = (r[base] || '').trim();
          const role = (r[base+1] || '').trim();
          const phone = (r[base+2] || '').trim();
          const email = (r[base+3] || '').trim();
          if (name || phone || email) contacts.push({ name, role, phone, email });
        }
        items.push({
          name: r[0], address: r[1] || '', hasLicense: (r[2] || '').includes('有'),
          contacts: contacts.length ? contacts : [{ name: '', role: '', phone: '', email: '' }],
          qualifications: (r[qualIdx] || '').split(';').filter(Boolean),
          workTypes: (r[qualIdx+1] || '').split(';').filter(Boolean),
          note: r[qualIdx+2] || ''
        });
      } else {
        // 旧形式: 会社名,住所,建設業許可,窓口(|区切り),資格,工事種目,備考
        contacts = (r[3] || '').split('|').filter(Boolean).map(s => {
          const p = s.split(':');
          return { name: p[0] || '', role: p[1] || '', phone: p[2] || '', email: p[3] || '' };
        });
        items.push({
          name: r[0], address: r[1] || '', hasLicense: (r[2] || '').includes('有'),
          contacts: contacts.length ? contacts : [{ name: '', role: '', phone: '', email: '' }],
          qualifications: (r[4] || '').split(';').filter(Boolean),
          workTypes: (r[5] || '').split(';').filter(Boolean),
          note: r[6] || ''
        });
      }
    });
  } else if (type === 'reviews') {
    rows.forEach(r => {
      if (!r[0]) return;
      const c = state.contractors.find(x => x.name === r[0]);
      if (!c) return;
      const scores = {};
      state.masters.evaluationCategories.forEach((cat, i) => { if (r[4 + i]) scores[cat] = Number(r[4 + i]); });
      items.push({
        contractorId: c.id, siteName: r[1] || '', reviewer: r[2] || '', date: r[3] || '',
        scores, comment: r[4 + state.masters.evaluationCategories.length] || ''
      });
    });
  }
  showModal(`
    <div style="font-size:15px;font-weight:500;margin-bottom:8px;"><i class="ti ti-alert-triangle" style="color:var(--accent-amber);"></i> 取り込み確認</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-bottom:14px;">${items.length}件を取り込みます。<br>※既存データは全て置き換わります。続行しますか？</div>
    <div style="display:flex;gap:6px;justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" id="imp-confirm">取り込む</button>
    </div>`);
  document.getElementById('imp-confirm').addEventListener('click', async () => {
    closeModal();
    showLoading('取り込み中...');
    try {
      const payload = type === 'contractors' ? { contractors: items } : { reviews: items };
      await api.replaceAll(payload);
      await refreshData();
      hideLoading();
      render();
      toast(`${items.length}件取り込みました`);
      document.getElementById('imp-text') && (document.getElementById('imp-text').value = '');
    } catch (e) { hideLoading(); toast('取り込み失敗: ' + e.message, 'error'); }
  });
}

function render() {
  renderNav();
  setTimeout(adjustHeaderSpacer, 0);
  if (currentView === 'list') renderList();
  else if (currentView === 'search') renderSearch();
  else if (currentView === 'detail') renderDetail();
  else if (currentView === 'register') { initForm(); renderRegister(); }
  else if (currentView === 'master') renderMaster();
  else if (currentView === 'csv') renderCSV();
}

// 固定ヘッダーの高さ分だけスペーサーを確保 (PWAでも入力欄が打てるようにsticky不使用)
function adjustHeaderSpacer() {
  const header = document.querySelector('.header');
  const spacer = document.getElementById('header-spacer');
  if (header && spacer) {
    const h = header.getBoundingClientRect().height;
    // ヘッダー高さ + 上部余白(safe-area+8px) + 下マージン14px + 余裕分
    spacer.style.height = (h + 24) + 'px';
  }
}
window.addEventListener('resize', adjustHeaderSpacer);
window.addEventListener('orientationchange', adjustHeaderSpacer);

// iOS PWA対策: 入力欄フォーカス時はヘッダーのfixedを一時解除
// (fixed/stickyヘッダーがあるとiOS PWAで入力欄のタップ判定がズレるバグ回避)
function setupInputFocusHandler() {
  document.addEventListener('focusin', (e) => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) {
      const header = document.querySelector('.header');
      if (header) header.style.position = 'static';
      const spacer = document.getElementById('header-spacer');
      if (spacer) spacer.style.height = '0px';
    }
  });
  document.addEventListener('focusout', (e) => {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) {
      setTimeout(() => {
        // 他の入力欄にフォーカス移動していなければ復帰
        const active = document.activeElement;
        if (!active || (active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA' && active.tagName !== 'SELECT')) {
          const header = document.querySelector('.header');
          if (header) header.style.position = 'fixed';
          adjustHeaderSpacer();
        }
      }, 100);
    }
  });
}

(async function init() {
  setupInputFocusHandler();
  showLoading('スプレッドシートに接続中...');
  const ok = await refreshData();
  hideLoading();
  if (!ok) {
    document.getElementById('main-view').innerHTML = `
      <div class="empty-state"><i class="ti ti-alert-circle"></i>
        スプレッドシートへの接続に失敗しました<br>
        <button class="btn btn-primary" onclick="location.reload()" style="margin-top:14px;"><i class="ti ti-refresh"></i>再読み込み</button>
      </div>`;
    return;
  }
  render();
})();

})();
</script>
